services:
  chelix-embedding-service:
    image: chelix-embedding-service
    build:
      dockerfile: Dockerfile
      context: .
    network_mode: "bridge"
    ports:
      - "127.0.0.1:8017:8017/tcp"
    container_name: chelix-embedding-service
    restart: "unless-stopped"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /data/chelix-embedding-service:/data/chelix-embedding-service:rw
    environment:
      - "API_KEY=${MY_API_KEY--}"
      - "HUGGINGFACE_API_KEY=${MY_HUGGINGFACE_API_KEY--}"
      - "MODEL=google/embeddinggemma-300m"
      - "CACHE_DIR=/data/chelix-embedding-service"
      - "LISTEN_IP=0.0.0.0"
      - "LISTEN_PORT=8017"
      - "RUST_LOG=info"
    command: ["/usr/local/bin/chelix-embedding-service"]
    memswap_limit: 3072m
    deploy:
      resources:
        limits:
          # cpus: "0.5"
          memory: 3072m
        reservations:
          memory: 1536m
